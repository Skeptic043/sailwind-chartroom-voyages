name: Share voyage
description: Share a voyage on its world's page and heatmap.
title: "Share voyage"
labels: ["share-voyage"]
body:
  - type: markdown
    attributes:
      value: |
        In Sailwind Chartroom, `File` > `Share voyage` saves your voyage and opens this form. Drag the `.voyage.json` file into the box below, then submit the form. Shared voyages are public and show your GitHub username.
  - type: textarea
    id: voyage
    attributes:
      label: Voyage file
      description: Drag the file here, or paste its contents.
    validations:
      required: true
