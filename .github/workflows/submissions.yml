name: Submissions

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

# One submission at a time, so each sees the ones before it.
concurrency:
  group: submissions
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      (
        contains(github.event.issue.labels.*.name, 'share-voyage') ||
        contains(github.event.issue.labels.*.name, 'enter-race') ||
        contains(github.event.issue.labels.*.name, 'create-course') ||
        contains(github.event.issue.labels.*.name, 'feature-world')
      ) &&
      !contains(github.event.issue.labels.*.name, 'accepted') &&
      github.event.issue.state_reason != 'completed' &&
      (
        github.event.action == 'opened' ||
        (
          github.event.action == 'edited' &&
          github.event.changes.body != null &&
          (
            contains(github.event.issue.labels.*.name, 'needs-fix') ||
            github.event.issue.state_reason == 'not_planned'
          ) &&
          (
            github.event.sender.login == github.event.issue.user.login ||
            github.event.sender.login == github.repository_owner
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The issue's text only ever reaches the script through environment variables.
      - name: Check the submission
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          RESULT_PATH: ${{ runner.temp }}/result.json
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/submit.mjs
      - name: Publish and reply
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_PATH: ${{ runner.temp }}/result.json
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(jq -r .ok "$RESULT_PATH")" = "true" ]; then
            node scripts/build-data.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add courses voyages runs worlds data
            git commit -m "Add submission #$ISSUE_NUMBER"
            git push
            jq -r .message "$RESULT_PATH" > "$RUNNER_TEMP/reply.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/reply.md"
            gh label create accepted --color 0e8a16 --description "Accepted submission" --force || true
            gh issue edit "$ISSUE_NUMBER" --add-label accepted
            gh issue edit "$ISSUE_NUMBER" --remove-label needs-fix || true
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" -f state=closed -f state_reason=completed >/dev/null
          elif [ "$(jq -r .alreadyAccepted "$RESULT_PATH")" = "true" ]; then
            gh label create accepted --color 0e8a16 --description "Accepted submission" --force || true
            gh issue edit "$ISSUE_NUMBER" --add-label accepted
            gh issue edit "$ISSUE_NUMBER" --remove-label needs-fix || true
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" -f state=closed -f state_reason=completed >/dev/null
          else
            jq -r .message "$RESULT_PATH" > "$RUNNER_TEMP/reply.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/reply.md"
            gh label create needs-fix --color d93f0b --description "Submission needs an edit before it can be accepted" --force || true
            gh issue edit "$ISSUE_NUMBER" --add-label needs-fix || true
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" -f state=closed -f state_reason=not_planned >/dev/null
          fi
